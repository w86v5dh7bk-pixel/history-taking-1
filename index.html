<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استبيان التاريخ المرضي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f4f3;--surface:#ffffff;--text:#1d2a2c;--muted:#66767a;--line:#dde4e2;
  --teal:#1f6f6b;--teal-soft:#e2efed;--plum:#7d3f5c;--plum-soft:#f5e9ef;--no:#a3443a;--no-soft:#f7e6e3;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111716;--surface:#1a2221;--text:#e6ecea;--muted:#97a6a3;--line:#2b3533;
  --teal:#62bab2;--teal-soft:#1b3330;--plum:#d79bb8;--plum-soft:#352530;--no:#e58b7f;--no-soft:#3a2420;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111716;--surface:#1a2221;--text:#e6ecea;--muted:#97a6a3;--line:#2b3533;
  --teal:#62bab2;--teal-soft:#1b3330;--plum:#d79bb8;--plum-soft:#352530;--no:#e58b7f;--no-soft:#3a2420;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 6px;max-width:720px;margin:0 auto}
.ttl b{display:block;font-size:1.05rem;color:var(--plum)}
.ttl span{font-size:.78rem;color:var(--muted)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.85rem}
.ghost.warn{border-color:var(--no);color:var(--no)}
#steps{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;max-width:720px;margin:0 auto;scrollbar-width:none}
#steps::-webkit-scrollbar{display:none}
#steps button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:.82rem;white-space:nowrap}
#steps button.cur{background:var(--teal);border-color:var(--teal);color:#fff}
#steps button.sym:not(.cur){border-color:var(--plum);color:var(--plum)}
#steps small{opacity:.75;margin-inline-start:4px}

main{max-width:720px;margin:0 auto;padding:18px 16px 120px}
.kick{color:var(--teal);font-size:.85rem;font-weight:600}
h1{font-size:1.55rem;margin:2px 0 0;color:var(--plum);line-height:1.3}
h1 + .en{margin-bottom:12px}
.en{direction:ltr;text-align:left;color:var(--muted);font-size:.85rem}

.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.q.add{border-inline-start:3px solid var(--plum)}
.q .ar{font-size:1.04rem;font-weight:600}
.plus{color:var(--plum);font-weight:700;margin-inline-end:4px}
.row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.yn{display:flex;gap:6px}
.yn button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 14px;min-width:56px}
.yn button[data-v="y"].on{background:var(--teal);border-color:var(--teal);color:#fff}
.yn button[data-v="n"].on{background:var(--no);border-color:var(--no);color:#fff}
input.t,input.f,textarea{flex:1;min-width:140px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px}
textarea{width:100%;min-height:90px;resize:vertical}
.h{color:var(--teal);font-weight:700;margin:22px 2px 2px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.h .en{color:var(--teal);opacity:.8}
.note{background:var(--plum-soft);color:var(--plum);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.92rem}
.script{background:var(--teal-soft);border-radius:10px;padding:10px 12px;margin:8px 0}
.script .ar{font-weight:600}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fields label{display:flex;flex-direction:column;font-size:.82rem;color:var(--muted);gap:4px}
.fields input{min-width:0}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 14px}
.seg button.on{background:var(--teal);border-color:var(--teal);color:#fff}

.pick{background:var(--surface);border:2px solid var(--plum);border-radius:14px;padding:14px;margin:12px 0}
.pick .ar{font-size:1.1rem;font-weight:700;color:var(--plum)}
.grp{margin-top:12px}
.grp > div:first-child{font-size:.8rem;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;text-align:right;line-height:1.25}
.chips button small{display:block;direction:ltr;text-align:left;color:var(--muted);font-size:.72rem}
.chips button.on{background:var(--plum);border-color:var(--plum);color:#fff}
.chips button.on small{color:#fff;opacity:.85}
.chips button .n{display:inline-block;background:#fff;color:var(--plum);border-radius:999px;font-size:.7rem;padding:0 6px;margin-inline-start:4px}

details.tips{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
details.tips summary{cursor:pointer;color:var(--teal);font-weight:600}
details.tips li{margin:4px 0;font-size:.92rem}

.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;direction:ltr;text-align:left;font-size:.9rem;line-height:1.6;overflow-x:auto;margin:12px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pri{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:600}
.empty{color:var(--muted);font-size:.92rem}

footer{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
footer .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
footer button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 16px;font-weight:600}
footer button.pri{background:var(--teal);border-color:var(--teal);color:#fff}
footer button:disabled{opacity:.4;cursor:default}
#pos{font-size:.85rem;color:var(--muted);text-align:center}
@media (max-width:420px){.fields{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.yn button,.chips button{transition:background .12s}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="ttl"><b>استبيان التاريخ المرضي</b><span dir="ltr">History taking · English + Arabic</span></div>
    <button id="newPt" class="ghost" type="button">مريض جديد</button>
  </div>
  <nav id="steps" aria-label="الأقسام"></nav>
</header>
<main id="main"></main>
<footer><div class="in">
  <button id="prev" type="button">السابق</button>
  <span id="pos"></span>
  <button id="next" class="pri" type="button">التالي</button>
</div></footer>

<script>
const C={
start:"When did it start?|متى بدأت المشكلة؟",
onset:"Did it start suddenly or gradually?|بدأت فجأة أو بالتدريج؟",
course:"Is it getting worse, improving, or staying the same?|هل تزيد، تتحسن، أو ثابتة؟",
cont:"Is it there all the time, or does it come and go?|هل هي مستمرة أو تجي وتروح؟",
where:"Where exactly is the pain? Can you point to it?|وين الألم بالضبط؟ تقدر تشير لمكانه؟",
pdesc:"How would you describe it: sharp, dull, burning, or cramping?|كيف توصفه: حاد، وجع ثقيل، حرقان، أو مغص؟",
pspread:"Does the pain spread anywhere else?|هل ينتقل الألم لأي مكان ثاني؟",
pwhen:"When does it happen, and how long does each episode last?|متى يجي الألم؟ وكم تستمر كل نوبة؟",
pworse:"Does anything make it worse?|هل فيه شيء يزيد الألم؟",
pbetter:"Does anything make it better?|هل فيه شيء يخفف الألم؟",
pscale:"On a scale of 0 to 10, how severe is it?|من صفر إلى عشرة، كم شدة الألم؟",
paffect:"How does it affect your daily activities or sleep?|كيف يؤثر على نشاطك اليومي أو نومك؟",
worse:"Does anything make it worse or better?|هل فيه شيء يزيده أو يخففه؟",
AS:"#Associated symptoms|الأعراض المصاحبة",
fever:"Have you had a fever?|هل جتك حرارة؟",
cough:"Have you had a cough?|هل عندك كحة؟",
palp:"Have you felt your heart racing or pounding?|هل تحس بتسارع أو خفقان بالقلب؟",
sob:"Have you felt short of breath?|هل تحس بضيق في التنفس؟",
orth:"Do you get short of breath when lying flat?|هل يضيق نفسك إذا استلقيت بشكل مسطح؟",
pnd:"Do you wake from sleep gasping for breath?|هل تصحى من النوم وأنت تلهث أو مخنوق؟",
faint:"Have you fainted or nearly fainted?|هل أغمي عليك أو حسيت إنك بتغمى عليك؟",
claud:"Do you get leg or buttock pain when walking?|هل يجيك ألم بالساق أو الأرداف مع المشي؟",
swell:"Have your feet, ankles, or legs become swollen?|هل لاحظت تورم بقدميك أو كاحليك أو ساقيك؟",
dizzy:"Have you felt dizzy or lightheaded?|هل تحس بدوخة أو خفة بالرأس؟",
chest:"Have you had any chest pain?|هل عندك ألم بالصدر؟",
wheeze:"Have you noticed a whistling sound when you breathe?|هل تسمع صفيرا مع التنفس؟",
wtloss:"Have you lost weight without trying? How much and over how long?|هل نزل وزنك بدون قصد؟ كم كيلو وخلال كم مدة؟",
appetite:"Have you lost your appetite?|هل قلت شهيتك؟",
nausea:"Have you felt sick to your stomach?|هل تحس بغثيان؟",
vomit:"Have you been vomiting?|هل عندك استفراغ؟",
abd:"Have you had any abdominal pain?|هل عندك ألم بالبطن؟",
heartburn:"Do you get a burning feeling behind your breastbone?|هل تحس بحرقة خلف عظمة الصدر؟",
hemat:"Have you vomited blood or material like coffee grounds?|هل استفرغت دما أو مادة تشبه تفل القهوة؟",
dysp:"Do you get upper abdominal discomfort or feel full after a small meal?|هل تحس بانزعاج أعلى البطن أو شبع بعد أكل قليل؟",
bloat:"Has your abdomen become swollen or bloated?|هل بطنك منتفخ أو زاد حجمه؟",
constip:"Have you had constipation or difficulty passing stool?|هل عندك إمساك أو صعوبة في إخراج البراز؟",
loose:"Have you had loose or watery stools?|هل عندك براز رخو أو مائي؟",
prbleed:"Have you noticed fresh blood in or on your stools?|هل لاحظت دما أحمر مع البراز أو على سطحه؟",
melena:"Have you passed black, sticky, tar-like stools?|هل صار البراز أسود ولزج مثل القطران؟",
dysuria:"Does it hurt or burn when you pass urine?|هل فيه ألم أو حرقان وقت التبول؟",
polyuria:"Are you passing a larger total amount of urine than usual?|هل كمية البول الإجمالية أكثر من المعتاد؟",
anuria:"Have you stopped passing urine altogether? Since when?|هل توقف خروج البول تماما؟ من متى؟",
hematuria:"Have you noticed blood in your urine?|هل لاحظت دما بالبول؟",
urgency:"Do you suddenly need to urinate and find it hard to hold on?|هل تجيك رغبة مفاجئة بالتبول ويصعب تأجيلها؟",
leak:"Does urine ever leak before you reach the toilet?|هل يتسرب البول قبل ما توصل للحمام؟",
discharge:"Have you noticed any discharge from the genital area?|هل لاحظت إفرازات من المنطقة التناسلية؟",
flank:"Have you had pain in your side or back below the ribs?|هل عندك ألم بالجنب أو الظهر تحت الأضلاع؟",
supra:"Have you had pain in the lower abdomen above the pubic bone?|هل عندك ألم أسفل البطن فوق عظمة العانة؟",
rash:"Have you noticed a skin rash?|هل لاحظت طفحا جلديا؟",
joint:"Have you had any joint pain or swelling?|هل عندك ألم أو تورم بالمفاصل؟",
nightsw:"Do you have night sweats?|هل تتعرق أثناء الليل؟",
tired:"Have you felt unusually tired?|هل تحس بتعب أكثر من المعتاد؟",
headache:"Have you had headaches?|هل عندك صداع؟",
hypo:"Do you feel unusually cold, tired, or constipated, or have you gained weight?|هل تحس ببرد غير معتاد، تعب، إمساك، أو زيادة وزن؟",
dysphagia:"Do you have difficulty swallowing?|هل عندك صعوبة في البلع؟",
odyn:"Is swallowing painful?|هل البلع مؤلم؟"
};
const B=["@start","@onset","@course","@cont"];

const SYM=[
{id:"chest",g:"cvs",ar:"ألم الصدر",en:"Chest pain",items:["@where","@start","@onset","@course","@cont",
"Were you resting or doing something when it began?|كنت مرتاح أو تسوي مجهود وقت ما بدأ؟",
"How would you describe the pain in your own words?|كيف توصف الألم بكلامك؟",
"Is it sharp or stabbing, heavy or tight, pressure-like, squeezing, tearing, or burning?|هل هو حاد أو مثل الطعن، ثقل أو ضيق، ضغط أو عصر، تمزق، أو حرقان؟",
"Does it spread to your shoulder, arm, jaw, back, or anywhere else?|هل ينتقل للكتف، الذراع، الفك، الظهر، أو أي مكان ثاني؟",
"When does it occur? Is there a particular time of day?|متى يجي؟ هل له وقت معين باليوم؟",
"How often does it happen, and how long does each episode last?|كم مرة يتكرر؟ وكم تستمر النوبة؟",
"Is it worse with physical activity or emotional stress?|هل يزيد مع المجهود أو الضغط النفسي؟",
"Does breathing deeply, coughing, moving, or lying down make it worse?|هل يزيد مع النفس العميق، الكحة، الحركة، أو الاستلقاء؟",
"Does rest, sitting forward, or an antacid help?|هل يخف مع الراحة، الجلوس والميل للأمام، أو مضاد الحموضة؟",
"If you used prescribed nitroglycerin under the tongue, did it help?|إذا استخدمت نيتروغليسرين موصوفا تحت اللسان، هل خف الألم؟",
"On a scale of 0 to 10, how severe is it? Does it limit your activities?|من صفر لعشرة، كم شدة الألم؟ وهل يمنع نشاطك؟",
"@AS","@dysphagia","@cough","@fever","@palp","@sob","@orth","@pnd","@faint","@claud","@swell","@dizzy",
"+Did it reach its worst intensity immediately?|هل وصل لأشد درجة من أول لحظة؟",
"+Have you had sweating, nausea, or vomiting with the pain?|هل معه تعرق، غثيان، أو استفراغ؟",
"+Have you had a recent operation, long journey, prolonged bed rest, or a previous blood clot?|هل سويت عملية، سافرت سفرا طويلا، جلست بالفراش مدة طويلة، أو سبق جتك جلطة؟",
"+Is one leg newly swollen or painful?|هل فيه تورم أو ألم جديد بساق واحدة؟",
"!Relief with nitroglycerin or antacids does not confirm the cause.|التحسن بالنيتروغليسرين أو مضاد الحموضة لا يؤكد سبب الألم."]},
{id:"sob",g:"cvs",ar:"ضيق التنفس",en:"Shortness of breath",items:[...B,
"What activities bring on the breathlessness?|وش الأنشطة اللي تسبب لك ضيق النفس؟",
"Does it happen only with strenuous exercise, or with ordinary activity?|هل يصير فقط مع التمرين الشديد أو حتى مع النشاط المعتاد؟",
"How far can you walk, and how many stairs can you climb before stopping?|كم مسافة تقدر تمشي؟ وكم درجة سلم تطلع قبل توقف؟",
"Do you get breathless after a few minutes of walking or while at rest?|هل يضيق نفسك بعد دقائق مشي أو حتى وأنت مرتاح؟",
"+Do you need extra pillows to breathe comfortably? How many?|هل تحتاج مخدات إضافية عشان تتنفس براحة؟ كم مخدة؟",
"+When you wake gasping, does sitting or standing help? How long does it take?|إذا صحيت مخنوق، هل يخف بالجلوس أو الوقوف؟ وخلال كم دقيقة؟",
"@AS","@cough","@fever","@palp","@orth","@pnd","@faint","@claud","@swell","@chest","@dizzy","@wheeze",
"Do you feel heaviness or tightness in your chest?|هل تحس بثقل أو ضيق بالصدر؟",
"+Have you coughed up blood or had new pain or swelling in one leg?|هل كحيت دما أو ظهر ألم أو تورم جديد بساق واحدة؟",
"+Do you have asthma or lung disease? Do inhalers help?|هل عندك ربو أو مرض بالرئة؟ وهل تفيدك البخاخات؟",
"+Have you had recent immobility, surgery, long travel, or hormone treatment?|هل قلت حركتك، سويت عملية، سافرت طويلا، أو أخذت هرمونات مؤخرا؟",
"+~Are you currently pregnant or have you recently given birth?|هل أنتِ حامل حاليا أو ولدتي مؤخرا؟"]},
{id:"palp",g:"cvs",ar:"الخفقان",en:"Palpitations",items:[...B,
"How does your heartbeat feel: fast, strong, pounding, fluttering, or skipping?|كيف تحس بالنبض: سريع، قوي، يدق بقوة، يرفرف، أو كأنه يفوت نبضة؟",
"Does it feel regular or irregular? Could you tap out the rhythm?|تحسه منتظم أو غير منتظم؟ ممكن تقلد إيقاعه بالنقر؟",
"Does caffeine, exercise, or stress make it worse?|هل يزيد مع الكافيين، التمرين، أو التوتر؟",
"Does resting, breathing slowly, or lying down make it better?|هل يخف مع الراحة، التنفس بهدوء، أو الاستلقاء؟",
"How does it affect your daily activities?|كيف يؤثر على نشاطك اليومي؟",
"+How long does each episode last, and how often does it happen?|كم تستمر النوبة؟ وكم مرة تتكرر؟",
"+Does it stop abruptly or slow down gradually?|هل يتوقف فجأة أو يهدأ بالتدريج؟",
"@AS","@cough","@fever","@orth","@pnd","@faint","@claud","@swell","@chest","@dizzy","@sob",
"Do you feel chest heaviness or have shaking of your hands?|هل تحس بثقل بالصدر أو رجفة باليدين؟",
"+Do you use energy drinks, nicotine, decongestants, inhalers, or stimulants?|هل تستخدم مشروبات طاقة، نيكوتين، أدوية زكام، بخاخات، أو منبهات؟",
"+Have you had heat intolerance, weight loss, or heavy bleeding?|هل عندك عدم تحمل للحر، نقص وزن، أو نزيف غزير؟"]},
{id:"faint",g:"cvs",ar:"الإغماء",en:"Fainting",items:[
"#Before the episode|قبل النوبة",
"When did you faint? Was this the first time?|متى أغمي عليك؟ وهل كانت أول مرة؟",
"If it happened before, how many times and under what circumstances?|إذا تكرر قبل، كم مرة وتحت أي ظروف؟",
"Did you faint suddenly, or did you have any warning?|هل أغمي عليك فجأة أو حسيت بعلامات قبله؟",
"Did you feel sweaty, nauseated, or vomit beforehand?|هل حسيت بتعرق، غثيان، أو استفرغت قبله؟",
"Did your vision blur or go dark?|هل تشوش نظرك أو اسودت الرؤية؟",
"Did you have palpitations or chest pain before you fainted?|هل حسيت بخفقان أو ألم صدر قبل الإغماء؟",
"Did you completely lose awareness, or could you still hear people?|هل فقدت الوعي تماما أو كنت تسمع الناس حولك؟",
"If you stayed awake, did the room spin, or did you feel about to faint?|إذا كنت واعي، هل حسيت المكان يدور أو حسيت إنك بتغمى عليك؟",
"What were you doing just before it happened?|وش كنت تسوي قبل النوبة مباشرة؟",

/* ---------- parsing ---------- */
function P(s){
  if(s[0]==="@") s=C[s.slice(1)];
  const it={};
  while("+#!~^*".includes(s[0])){
    ({"+":()=>it.added=1,"#":()=>it.head=1,"!":()=>it.note=1,"~":()=>it.fem=1,"^":()=>it.male=1,"*":()=>it.script=1})[s[0]]();
    s=s.slice(1);
  }
  const p=s.split("|"); it.en=p[0]; it.ar=p[1]; return it;
}
SYM.forEach(x=>x.items=x.items.map(P));
GEN.forEach(x=>x.items=x.items.map(P));
const SYMBY=Object.fromEntries(SYM.map(x=>[x.id,x]));
const GENBY=Object.fromEntries(GEN.map(x=>[x.id,x]));
const isQ=it=>!it.head&&!it.note&&!it.script;

const AUX=/^(Do|Does|Is|Are|Have|Has|Did|Was|Were|Can|Could|If you used)\b/;
function isYN(en){
  if(!AUX.test(en)||en.includes(": ")) return false;
  const first=en.split("?")[0];
  if(/^(Is|Does|Did|Was) (it|the|your)\b/.test(en) && /, .* or /.test(first)) return false;
  return true;
}

/* ---------- state ---------- */
const KEY="hx-draft-v1";
function fresh(){return {pt:{name:"",age:"",sex:"",nat:"",comf:"",dur:"",came:"",notes:""},sym:[],a:{},step:0}}
let st=null;
try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!st||!st.pt) st=fresh();
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

function steps(){return ["open",...st.sym.map(i=>"s:"+i),...GEN.map(g=>g.id),"sum"]}
function sec(s){return s.startsWith("s:")?SYMBY[s.slice(2)]:GENBY[s]}
function label(s){if(s==="open")return "البداية";if(s==="sum")return "الملخص";const x=sec(s);return x.short||x.ar}
function vis(it){if(it.fem&&st.pt.sex==="m")return false;if(it.male&&st.pt.sex==="f")return false;return true}
function answered(k){const a=st.a[k];return a&&(a.v||(a.t&&a.t.trim()))}
function count(s){
  if(s==="open"||s==="sum") return null;
  const qs=sec(s).items.filter(it=>isQ(it)&&vis(it));
  return [qs.filter(it=>answered(it.en)).length,qs.length];
}

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function qHTML(it){
  const i=KEYS.push(it.en)-1, yn=isYN(it.en), a=st.a[it.en]||{};
  return `<div class="q${it.added?" add":""}" data-i="${i}">
    <div class="ar">${it.added?'<span class="plus">+</span>':""}${esc(it.ar)}</div>
    <div class="en" dir="ltr">${esc(it.en)}</div>
    <div class="row">${yn?`<div class="yn"><button type="button" data-v="y" class="${a.v==="y"?"on":""}">نعم</button><button type="button" data-v="n" class="${a.v==="n"?"on":""}">لا</button></div>`:""}
    <input class="t" data-i="${i}" value="${esc(a.t)}" placeholder="${yn?"تفاصيل…":"الإجابة…"}" aria-label="${esc(it.ar)}"></div></div>`;
}
function itemsHTML(items){
  return items.filter(vis).map(it=>{
    if(it.head) return `<div class="h"><span>${esc(it.ar)}</span><span class="en">${esc(it.en)}</span></div>`;
    if(it.note) return `<div class="note">${esc(it.ar)}<div class="en" dir="ltr" style="color:inherit;opacity:.8">${esc(it.en)}</div></div>`;
    if(it.script) return `<div class="script"><div class="ar">${it.added?'<span class="plus">+</span>':""}${esc(it.ar)}</div><div class="en" dir="ltr">${esc(it.en)}</div></div>`;
    return qHTML(it);
  }).join("");
}

function render(){
  const S=steps(); st.step=Math.max(0,Math.min(st.step,S.length-1)); const s=S[st.step];
  KEYS=[];
  let h;
  if(s==="open") h=openHTML();
  else if(s==="sum") h=sumHTML();
  else{
    const x=sec(s), isSym=s.startsWith("s:");
    const kick=isSym?`أسئلة العرض ${st.sym.indexOf(x.id)+1} من ${st.sym.length}`:"التاريخ العام";
    h=`<div class="kick">${kick}</div><h1>${esc(x.ar)}</h1><div class="en">${esc(x.en)}</div>${itemsHTML(x.items)}`;
  }
  $("main").innerHTML=h;
  renderNav();
  save();
}
function renderNav(){
  const S=steps();
  $("steps").innerHTML=S.map((s,i)=>{const c=count(s);return `<button type="button" data-step="${i}" class="${i===st.step?"cur":""} ${s.startsWith("s:")?"sym":""}">${esc(label(s))}${c&&c[0]?`<small>${c[0]}/${c[1]}</small>`:""}</button>`}).join("");
  const cur=$("steps").querySelector(".cur"); if(cur) cur.scrollIntoView({block:"nearest",inline:"center"});
  $("prev").disabled=st.step===0;
  const last=st.step===S.length-1;
  $("next").disabled=last;
  $("next").textContent=st.step===S.length-2?"الملخص":"التالي";
  $("pos").textContent=`${st.step+1} / ${S.length}`;
}
function go(i){st.step=i;render();window.scrollTo(0,0)}

/* ---------- summary ---------- */
function block(x,seen,L,title){
  const det=[],pos=[],neg=[];
  x.items.forEach(it=>{
    if(!isQ(it)||!vis(it)||seen.has(it.en)||!answered(it.en)) return;
    seen.add(it.en);
    const a=st.a[it.en], t=(a.t||"").trim();
    if(a.v==="y") pos.push(`  (+) ${it.en}${t?" — "+t:""}`);
    else if(a.v==="n") neg.push(`  (−) ${it.en}${t?" — "+t:""}`);
    else det.push(`  • ${it.en} → ${t}`);
  });
  if(!det.length&&!pos.length&&!neg.length) return;
  L.push(title);
  L.push(...det);
  if(pos.length){L.push("  Positive:");L.push(...pos.map(l=>"  "+l))}
  if(neg.length){L.push("  Negative:");L.push(...neg.map(l=>"  "+l))}
  L.push("");
}
function buildSummary(){
  const p=st.pt,L=[],seen=new Set();
  const sex=p.sex==="m"?"Male":p.sex==="f"?"Female":"—";
  L.push("HISTORY SUMMARY  ("+new Date().toLocaleDateString("en-GB")+")","");
  L.push("Patient: "+(p.name||"—"),"Age: "+(p.age||"—")+"   Sex: "+sex+"   Nationality: "+(p.nat||"—"),"");
  L.push("Presenting complaint: "+(st.sym.map(i=>SYMBY[i].en).join(", ")||"—"));
  L.push("Duration: "+(p.dur||"—"));
  if(p.came) L.push("Arrived: "+p.came);
  L.push("");
  if(st.sym.length){
    L.push("HISTORY OF PRESENTING ILLNESS","");
    st.sym.forEach(i=>block(SYMBY[i],seen,L,"▸ "+SYMBY[i].en));
  }
  GEN.filter(g=>g.id!=="close").forEach(g=>block(g,seen,L,g.en.toUpperCase()));
  block(GENBY.close,seen,L,"CLOSING");
  if(p.notes&&p.notes.trim()) L.push("NOTES",p.notes.trim(),"");
  return L.join("\n").trim();
}

/* ---------- events ---------- */
$("main").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.v){
    const k=KEYS[b.closest(".q").dataset.i], a=st.a[k]||(st.a[k]={});
    a.v=a.v===b.dataset.v?"":b.dataset.v;
    b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.v===a.v));
    save(); renderNav(); return;
  }
  if(b.dataset.sym){
    const id=b.dataset.sym, n=st.sym.indexOf(id);
    if(n>-1) st.sym.splice(n,1); else st.sym.push(id);
    const y=window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if(b.dataset.sex){
    st.pt.sex=st.pt.sex===b.dataset.sex?"":b.dataset.sex;
    b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.sex===st.pt.sex));
    save(); renderNav(); return;
  }
  if(b.id==="copy") copySummary(b);
});
$("main").addEventListener("input",e=>{
  const t=e.target;
  if(t.classList.contains("t")){
    const k=KEYS[t.dataset.i], a=st.a[k]||(st.a[k]={}); a.t=t.value; save(); renderNav();
  }else if(t.dataset.f){
    st.pt[t.dataset.f]=t.value; save();
    if(t.dataset.f==="notes"){const s=$("sumtext"); if(s) s.textContent=buildSummary();}
  }
});
$("steps").addEventListener("click",e=>{const b=e.target.closest("button[data-step]"); if(b) go(+b.dataset.step)});
$("prev").onclick=()=>go(st.step-1);
$("next").onclick=()=>go(st.step+1);

let armed=null;
$("newPt").onclick=()=>{
  const b=$("newPt");
  if(!armed){b.textContent="أكيد؟ اضغط مرة ثانية";b.classList.add("warn");armed=setTimeout(()=>{armed=null;b.textContent="مريض جديد";b.classList.remove("warn")},3000);return}
  clearTimeout(armed);armed=null;b.textContent="مريض جديد";b.classList.remove("warn");
  st=fresh();go(0);
};

function copySummary(btn){
  const text=buildSummary();
  const done=()=>{btn.textContent="تم النسخ";setTimeout(()=>btn.textContent="نسخ الملخص",1800)};
  const fallback=()=>{
    const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(e){}
    ta.remove();
    if(ok) done(); else {const r=document.createRange();r.selectNodeContents($("sumtext"));const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="النص محدد، انسخه يدويا"}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,fallback); else fallback();
}

render();
</script>
